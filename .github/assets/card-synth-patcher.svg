  <style>
    .card{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}.accent,.label{fill:#59636e}.title{fill:#1f2328;font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.copy{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.pill{fill:#fff;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.5px}
