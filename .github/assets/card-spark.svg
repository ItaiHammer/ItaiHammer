<svg xmlns="http://www.w3.org/2000/svg" width="960" height="116" viewBox="0 0 960 116" role="img" aria-labelledby="title desc">
  <title id="title">sPARK — background project</title>
  <desc id="desc">Smart parking predictions for San Jose State University — made by students for students.</desc>
  <style>
    .card{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}.accent,.label{fill:#9a6700}.title{fill:#1f2328;font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.copy{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.pill{fill:#fff;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.5px}
    @media(prefers-color-scheme:dark){.card{fill:#151b23;stroke:#3d444d}.accent{fill:#d29922}.label{fill:#9e6a03}.title{fill:#f0f6fc}.copy{fill:#9198a1}}
