<svg xmlns="http://www.w3.org/2000/svg" width="960" height="126" viewBox="0 0 960 126" role="img" aria-labelledby="title desc">
  <title id="title">Ollo — main focus</title>
  <desc id="desc">The GitHub repository for Ollo, a connected plant companion that makes plant care easier and more fun, containing its firmware, server, documentation, and future mobile app.</desc>
  <style>
    .card{fill:#f6f8fa}.status{fill:#8250df}.title{fill:#1f2328;font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.copy{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.pill{fill:#fff;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.5px}
    @media(prefers-color-scheme:dark){.card{fill:#161b22}.status{fill:#a371f7}.title{fill:#f0f6fc}.copy{fill:#8b949e}}
  </style>
  <rect class="card" width="960" height="122" rx="12" />
  <rect class="status" width="6" height="122" rx="3" />
  <rect class="status" x="22" y="14" width="86" height="20" rx="10" />
  <text class="pill" x="65" y="28" text-anchor="middle">MAIN FOCUS</text>
  <text class="title" x="22" y="61">Ollo</text>
  <text class="copy" x="22" y="85">The GitHub repository for Ollo, a connected plant companion that makes plant care easier and more fun,</text>
  <text class="copy" x="22" y="105">containing its firmware, server, documentation, and future mobile app.</text>
</svg>
