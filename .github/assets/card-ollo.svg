<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" role="img" aria-labelledby="title desc">
  <title id="title">Ollo — main focus</title>
  <desc id="desc">The GitHub repository for Ollo, a connected plant companion that makes plant care easier and more fun, containing its firmware, server, documentation, and future mobile app.</desc>
  <style>
    .card{fill:#f6f8fa}.shadow{display:none}.status{fill:#8250df}.title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.copy{fill:#59636e;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.pill{fill:#fff;font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.6px}
    @media(prefers-color-scheme:dark){.card{fill:#161b22}.status{fill:#a371f7}.title{fill:#f0f6fc}.copy{fill:#8b949e}}
  </style>
  <rect class="shadow" x="2" y="4" width="956" height="152" rx="15" />
  <rect class="card" x="1" y="1" width="958" height="152" rx="15" />
  <rect class="status" x="1" y="1" width="8" height="152" rx="4" />
  <rect class="status" x="29" y="21" width="93" height="24" rx="12" />
  <text class="pill" x="75.5" y="37" text-anchor="middle">MAIN FOCUS</text>
  <text class="title" x="29" y="78">Ollo</text>
  <text class="copy" x="29" y="108">The GitHub repository for Ollo, a connected plant companion that makes plant care easier and more fun,</text>
  <text class="copy" x="29" y="132">containing its firmware, server, documentation, and future mobile app.</text>
</svg>
