<svg xmlns="http://www.w3.org/2000/svg" width="960" height="126" viewBox="0 0 960 126" role="img" aria-labelledby="title desc">
  <title id="title">Ollo — main focus</title>
  <desc id="desc">The GitHub repository for Ollo, a connected plant companion that makes plant care easier and more fun, containing its firmware, server, documentation, and future mobile app.</desc>
  <style>
    .card{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1}.accent,.label{fill:#8250df}.title{fill:#1f2328;font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.copy{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.pill{fill:#fff;font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.5px}
    @media(prefers-color-scheme:dark){.card{fill:#151b23;stroke:#3d444d}.accent{fill:#ab7df8}.label{fill:#8957e5}.title{fill:#f0f6fc}.copy{fill:#9198a1}}
  </style>
  <rect class="card" x=".5" y=".5" width="959" height="121" rx="6" />
  <rect class="accent" x="1" y="1" width="4" height="120" rx="2" />
  <rect class="label" x="20" y="14" width="86" height="20" rx="10" />
  <text class="pill" x="63" y="28" text-anchor="middle">MAIN FOCUS</text>
  <text class="title" x="20" y="61">Ollo</text>
  <text class="copy" x="20" y="85">The GitHub repository for Ollo, a connected plant companion that makes plant care easier and more fun,</text>
  <text class="copy" x="20" y="105">containing its firmware, server, documentation, and future mobile app.</text>
</svg>
