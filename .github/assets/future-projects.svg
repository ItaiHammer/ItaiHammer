<svg xmlns="http://www.w3.org/2000/svg" width="960" height="286" viewBox="0 0 960 286" role="img" aria-labelledby="title desc">
  <title id="title">Itai's future projects</title>
  <desc id="desc">Pipply, an automated job-application tracker, is the next project on the horizon. Synth Patcher, a platform for creating and sharing analog synth patches, comes later.</desc>
  <style>
    .card { fill:#f6f8fa; }
    .shadow { display:none; }
    .status { fill:#59636e; }
    .title { fill:#1f2328; font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .copy { fill:#59636e; font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .pill { fill:#fff; font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.6px; }
    @media (prefers-color-scheme:dark) {
      .card { fill:#161b22; }
      .status { fill:#6e7681; }
      .title { fill:#f0f6fc; }
      .copy { fill:#8b949e; }
    }
  </style>
  <rect class="shadow" x="21" y="13" width="918" height="124" rx="15" />
  <rect class="card" x="20" y="10" width="920" height="124" rx="15" />
  <rect class="status" x="20" y="10" width="8" height="124" rx="4" />
  <rect class="status" x="48" y="30" width="120" height="24" rx="12" />
  <text class="pill" x="108" y="46" text-anchor="middle">ON THE HORIZON</text>
  <text class="title" x="48" y="87">Pipply</text>
  <text class="copy" x="48" y="112">An automated job-application tracker that keeps application statuses organized.</text>

  <rect class="shadow" x="21" y="157" width="918" height="124" rx="15" />
  <rect class="card" x="20" y="154" width="920" height="124" rx="15" />
  <rect class="status" x="20" y="154" width="8" height="124" rx="4" />
  <rect class="status" x="48" y="174" width="120" height="24" rx="12" />
  <text class="pill" x="108" y="190" text-anchor="middle">ON THE HORIZON</text>
  <text class="title" x="48" y="231">Synth Patcher</text>
  <text class="copy" x="48" y="256">A web platform for creating and sharing analog synth patches.</text>
</svg>
