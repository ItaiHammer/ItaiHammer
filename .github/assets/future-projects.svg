<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">Itai's future projects</title>
  <desc id="desc">Pipply, an automated job-application tracker, is the next project on the horizon. Synth Patcher, a platform for creating and sharing analog synth patches, comes later.</desc>
  <style>
    .card { fill:#f6f8fa; }
    .status { fill:#59636e; }
    .title { fill:#1f2328; font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .copy { fill:#59636e; font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .pill { fill:#fff; font:700 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.5px; }
    @media (prefers-color-scheme:dark) {
      .card { fill:#161b22; }
      .status { fill:#6e7681; }
      .title { fill:#f0f6fc; }
      .copy { fill:#8b949e; }
    }
  </style>
  <rect class="card" width="960" height="110" rx="12" />
  <rect class="status" width="6" height="110" rx="3" />
  <rect class="status" x="22" y="14" width="110" height="20" rx="10" />
  <text class="pill" x="77" y="28" text-anchor="middle">ON THE HORIZON</text>
  <text class="title" x="22" y="61">Pipply</text>
  <text class="copy" x="22" y="87">An automated job-application tracker that keeps application statuses organized.</text>

  <rect class="card" y="116" width="960" height="110" rx="12" />
  <rect class="status" y="116" width="6" height="110" rx="3" />
  <rect class="status" x="22" y="130" width="110" height="20" rx="10" />
  <text class="pill" x="77" y="144" text-anchor="middle">ON THE HORIZON</text>
  <text class="title" x="22" y="177">Synth Patcher</text>
  <text class="copy" x="22" y="203">A web platform for creating and sharing analog synth patches.</text>
</svg>
